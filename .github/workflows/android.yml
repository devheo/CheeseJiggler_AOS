name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        ENCODED_KEYSTORE: ${{ secrets.SET_SIGNING_NICSY_STORE_FILE_BASE64 }}
      run: |
        if [ -z "$ENCODED_KEYSTORE" ]; then
          echo "❌ Error: SET_SIGNING_NICSY_STORE_FILE_BASE64 secret is missing!"
          echo "Please add it to GitHub Settings > Secrets and variables > Actions > Repository secrets."
          exit 1
        fi
        
        # Decode and handle potential whitespace/newlines
        echo "$ENCODED_KEYSTORE" | tr -d '[:space:]' | base64 --decode > release.jks
        
        # Verify file exists and is not empty
        if [ ! -s release.jks ]; then
          echo "❌ Error: Decoded keystore file is empty. Check your Base64 value."
          exit 1
        fi
        
        # Verify keystore validity with keytool
        keytool -list -keystore release.jks -storepass "${{ secrets.SET_SIGNING_NICSY_STORE_PASSWORD }}" > /dev/null && echo "✅ Keystore is valid." || (echo "❌ Keystore is INVALID! Check your password and file data." && exit 1)

    - name: Build with Gradle
      env:
        SET_SIGNING_NICSY_STORE_FILE_PATH: ../release.jks
        SET_SIGNING_NICSY_STORE_PASSWORD: ${{ secrets.SET_SIGNING_NICSY_STORE_PASSWORD }}
        SET_SIGNING_NICSY_KEY_ALIAS: ${{ secrets.SET_SIGNING_NICSY_KEY_ALIAS }}
        SET_SIGNING_NICSY_KEY_PASSWORD: ${{ secrets.SET_SIGNING_NICSY_KEY_PASSWORD }}
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION_NAME=${GITHUB_REF#refs/tags/v}
          ./gradlew :app:assembleProdRelease -PversionCode=${{ github.run_number }} -PversionName=$VERSION_NAME
        else
          ./gradlew :app:assembleDevDebug -PversionCode=${{ github.run_number }}
        fi

    - name: Rename and Prepare APK (Robust)
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        TAG_NAME=${GITHUB_REF#refs/tags/}
        # List all generated APKs for debugging
        find app/build/outputs/apk/ -name "*.apk"
        # Rename the production release APK to a specific versioned name
        # We look specifically in the prod/release folder
        APK_PATH=$(find app/build/outputs/apk/prod/release/ -name "*.apk" | head -n 1)
        if [ -n "$APK_PATH" ]; then
          mv "$APK_PATH" "app/build/outputs/apk/prod/release/CheeseJiggler_$TAG_NAME.apk"
          echo "Renamed $APK_PATH to CheeseJiggler_$TAG_NAME.apk"
        else
          echo "No APK found in prod/release folder!"
          exit 1
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: app/build/outputs/apk/**/*.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/prod/release/CheeseJiggler_*.apk
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
