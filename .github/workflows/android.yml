name: Android CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Keystore
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        echo "${{ secrets.SET_SIGNING_NICSY_STORE_FILE_BASE64 }}" | base64 --decode > release.jks

    - name: Build with Gradle
      env:
        SET_SIGNING_NICSY_STORE_FILE_PATH: ../release.jks
        SET_SIGNING_NICSY_STORE_PASSWORD: ${{ secrets.SET_SIGNING_NICSY_STORE_PASSWORD }}
        SET_SIGNING_NICSY_KEY_ALIAS: ${{ secrets.SET_SIGNING_NICSY_KEY_ALIAS }}
        SET_SIGNING_NICSY_KEY_PASSWORD: ${{ secrets.SET_SIGNING_NICSY_KEY_PASSWORD }}
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          ./gradlew assembleProdRelease -PversionCode=${{ github.run_number }}
        else
          ./gradlew assembleDevDebug -PversionCode=${{ github.run_number }}
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-apk
        path: app/build/outputs/apk/**/*.apk

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/prod/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
